on:
  push:
    branches:
      - main
    paths-ignore:
      - '**.md'
  pull_request:
    paths-ignore:
      - '**.md'
  workflow_dispatch:

jobs:
  deploy-react-app:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v2

      - name: Setup Node.js
        uses: actions/setup-node@v2
        with:
          node-version: '16.x'

      - name: Install dependencies
        run: npm install  # or 'yarn install' if you're using Yarn

      - name: Build the React app
        run: npm run build  # Make sure your package.json has a build script

      - name: Deploy to GitHub Pages
        if: github.ref == 'refs/heads/main'
        run: |
          git config user.name "philkrause"
          git config user.email "philkrause@users.noreply.github.com"
          # Stage the build output somewhere outside the repo working tree first —
          # `git checkout --orphan` keeps node_modules/.gitignore/etc. sitting on disk,
          # and `git rm -rf .` deletes .gitignore itself, so a later `git add .` would
          # end up re-committing node_modules (bitten by this once already).
          mkdir -p /tmp/gh-pages-deploy
          cp -r build/. /tmp/gh-pages-deploy/
          echo "clustergames.io" > /tmp/gh-pages-deploy/CNAME
          git checkout --orphan gh-pages
          git rm -rf .
          git clean -fdx .
          cp -r /tmp/gh-pages-deploy/. .
          git add -A
          git commit -m "Deploy to GitHub Pages"
          git push -f origin gh-pages